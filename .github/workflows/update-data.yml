name: 每日数据更新

on:
  schedule:
    # 每天 03:30 (UTC) 运行 —— 站点数据每日更新，早间拿到最新版本
    - cron: '30 3 * * *'
  workflow_dispatch: # 支持手动触发

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          pip install -r tools/requirements.txt

      - name: 全量抓取并生成 data.js
        run: |
          python tools/scraper.py --out js/data.js

      - name: 校验 JS 语法
        run: |
          node --check js/data.js || true

      - name: 提交变更（无变更时跳过）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/data.js
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "chore: 自动更新对局数据 $(date -u +%Y-%m-%d)"
            git push
          fi
